name: mise

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: 0 0 * * 5
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: mise test
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Mise
        uses: jdx/mise-action@v4
        with:
          install: false

      # Test the plugin as checked out, so pull requests exercise their own code
      # instead of whatever is on the default branch.
      - name: Link plugin
        run: mise plugins link --force xcodes "$PWD"

      - run: mise exec xcodes@latest -- xcodes --help
